<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200" role="img" aria-labelledby="t d">
  <title id="t">Top Languages by Commit</title>
  <desc id="d">Donut chart of commits with a distinct color per language.</desc>
  <style>
    .title { font: 600 17px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #58a6ff; }
    .subtitle { font: 400 10.5px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #77909c; }
    .label { font: 400 12.5px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9; }
    .value { font: 600 12.5px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9; text-anchor: end; }
    .pct { font: 400 11px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #8b949e; }
    .center-top { font: 700 24px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #c9d1d9; text-anchor: middle; }
    .center-bottom { font: 400 9px "Segoe UI", Ubuntu, "Helvetica Neue", Sans-Serif; fill: #8b949e; text-anchor: middle; letter-spacing: 1px; }
  </style>
  <rect x="0.5" y="0.5" width="399" height="199" rx="8" fill="#0d1117" stroke="#30363d" />
  <text x="28" y="34" class="title">Top Languages by Commit</text>
  <text x="28" y="50" class="subtitle">47 commits grouped by each repo's primary language</text>
  <rect x="28" y="66" width="11" height="11" rx="2" fill="#3178C6" /><text x="47" y="76" class="label">TypeScript</text><text x="218" y="76" class="value">32</text><text x="224" y="76" class="pct">68%</text>
  <rect x="28" y="93" width="11" height="11" rx="2" fill="#DA5B0B" /><text x="47" y="103" class="label">Jupyter Notebook</text><text x="218" y="103" class="value">7</text><text x="224" y="103" class="pct">15%</text>
  <rect x="28" y="120" width="11" height="11" rx="2" fill="#8CC84B" /><text x="47" y="130" class="label">Python</text><text x="218" y="130" class="value">6</text><text x="224" y="130" class="pct">13%</text>
  <rect x="28" y="147" width="11" height="11" rx="2" fill="#F1E05A" /><text x="47" y="157" class="label">JavaScript</text><text x="218" y="157" class="value">2</text><text x="224" y="157" class="pct">4%</text>
  <g>
    <path d="M 318.00 54.00 A 58 58 0 1 1 265.39 136.41 L 287.16 126.31 A 34 34 0 1 0 318.00 78.00 Z" fill="#3178C6" stroke="#0d1117" stroke-width="2" />
