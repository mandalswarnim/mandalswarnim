    <path d="M 302.68 56.06 A 58 58 0 0 1 318.00 54.00 L 318.00 78.00 A 34 34 0 0 0 309.02 79.21 Z" fill="#F1E05A" stroke="#0d1117" stroke-width="2" />
    <circle cx="318" cy="112" r="32" fill="#0d1117" />
