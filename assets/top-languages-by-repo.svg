    <path d="M 199.91 86.19 A 56 56 0 0 1 246.00 62.00 L 246.00 86.00 A 32 32 0 0 0 219.66 99.82 Z" fill="#F1E05A" stroke="#0d1117" stroke-width="2" />
    <circle cx="246" cy="118" r="30" fill="#0d1117" />
